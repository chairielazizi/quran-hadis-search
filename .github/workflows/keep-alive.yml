name: Keep Supabase Alive

on:
  schedule:
    # Akan berjalan setiap 3 hari pada pukul 12 tengah malam (UTC)
    - cron: '0 0 */3 * *'
  # Membenarkan anda menekan butang "Run workflow" secara manual di Github Actions
  workflow_dispatch: 

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Ping Supabase (Run check-db.mts)
        env:
          # Membaca nilai dari Github Settings > Secrets and variables > Actions
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/check-db.mts
